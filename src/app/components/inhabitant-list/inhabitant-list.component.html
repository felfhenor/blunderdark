@if (showSearch()) {
  <div class="relative mb-2">
    <input
      type="text"
      class="input input-xs input-bordered w-full pr-8"
      placeholder="Search by name, type, trait..."
      [ngModel]="searchQuery()"
      (ngModelChange)="searchQuery.set($event)"
      (keydown.escape)="clearSearch()"
    />
    @if (searchQuery()) {
      <button
        class="btn btn-xs btn-ghost btn-circle absolute right-0 top-0"
        (click)="clearSearch()"
      >
        <app-icon name="tablerX" size="12px" />
      </button>
    }
  </div>
}

@if (showFilters()) {
  <div class="flex flex-wrap gap-2 mt-1">
    <button
      class="btn btn-xs"
      appSfx="ui-click"
      [sfxOffset]="0"
      [class.btn-primary]="activeFilter() === 'all'"
      [class.btn-ghost]="activeFilter() !== 'all'"
      (click)="setFilter('all')"
    >
      All ({{ allCount() | number: '1.0-0' }})
    </button>
    <button
      class="btn btn-xs"
      appSfx="ui-click"
      [sfxOffset]="1"
      [class.btn-primary]="activeFilter() === 'assigned'"
      [class.btn-ghost]="activeFilter() !== 'assigned'"
      (click)="setFilter('assigned')"
    >
      Assigned ({{ assignedCount() | number: '1.0-0' }})
    </button>
    <button
      class="btn btn-xs"
      appSfx="ui-click"
      [sfxOffset]="2"
      [class.btn-primary]="activeFilter() === 'unassigned'"
      [class.btn-ghost]="activeFilter() !== 'unassigned'"
      (click)="setFilter('unassigned')"
    >
      Idle ({{ unassignedCount() | number: '1.0-0' }})
    </button>
    @if (travelingCount() > 0) {
      <button
        class="btn btn-xs"
        appSfx="ui-click"
        [sfxOffset]="3"
        [class.btn-info]="activeFilter() === 'traveling'"
        [class.btn-ghost]="activeFilter() !== 'traveling'"
        (click)="setFilter('traveling')"
      >
        Traveling ({{ travelingCount() | number: '1.0-0' }})
      </button>
    }
  </div>
}

<div class="inhabitant-scroll-list mt-2" [style.max-height]="maxHeight()">
  @for (entry of filteredEntries(); track entry.instance.instanceId) {
    <div
      class="inhabitant-list-entry"
      [class.selected]="selectedId() === entry.instance.instanceId"
      (click)="onSelect(entry)"
    >
      <app-inhabitant-card
        class="flex-1 min-w-0"
        [instance]="entry.instance"
        [definition]="entry.def"
        [showHunger]="showHunger()"
        [showAssignment]="showAssignment() ?? true"
        [synergyRoomId]="synergyRoomId()"
      />
      @if (actionLabel()) {
        <button
          class="btn btn-xs btn-primary flex-shrink-0"
          appSfx="ui-click"
          (click)="onAction(entry, $event)"
        >
          {{ actionLabel() }}
        </button>
      }
    </div>
  } @empty {
    <p class="text-xs opacity-50">{{ emptyMessage() }}</p>
  }
</div>
